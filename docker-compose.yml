services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxhub
      POSTGRES_USER: fluxhub
      POSTGRES_PASSWORD: fluxhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://fluxhub:fluxhub@db:5432/fluxhub
      FLUX_SECRET: change-me-in-prod
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
